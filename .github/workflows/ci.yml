name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The catalogue tests run against a real MongoDB rather than a mock —
      # the query splitting they cover is exactly the part a mock would hide.
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm run install:all

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/upahaar_ci

      - name: Build
        run: npm run build

      - name: Check the Delhi coverage map is up to date
        run: |
          npm run docs:delhi
          git diff --exit-code docs/delhi-coverage.md \
            || (echo "::error::docs/delhi-coverage.md is stale — run 'npm run docs:delhi'" && exit 1)
